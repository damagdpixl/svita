# JVM for the build: pinned locally; CI resolves JDK 21 via the foojay toolchain resolver.
# RAM caps are LOW ON PURPOSE: this repo is built on a 16 GB single-channel host where
# build + desktop load has frozen the machine (incident 27.09.2026). Do not raise
# without checking host memory; subagents must `./gradlew --stop` after test runs.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m
org.gradle.workers.max=2
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g
