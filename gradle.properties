# JVM for the build: pinned locally; CI resolves JDK 21 via the foojay toolchain resolver.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
